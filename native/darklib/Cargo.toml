[package]
name = "darklib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Stage 3a codec pipeline: pure-Rust PNG/JPEG (no C, cross-compiles trivially).
# libwebp/libjpeg-turbo/libavif slot in behind the ImageCodec interface later.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
