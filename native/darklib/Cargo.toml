[package]
name = "darklib"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Offline, royalty-free image core — lossless metadata surgery (strip/extract/carry), colour management (ICC + CICP→ICC synthesis), and AV1/WebP/JPEG/PNG decode·encode behind one engine."
keywords = ["image", "avif", "metadata", "exif", "icc"]
categories = ["multimedia::images", "encoding"]
readme = "README.md"
license = "GPL-3.0-only"
# repository / homepage: set when the standalone repo is created.

[lib]
# `rlib` so the pure `engine` is usable as a normal Rust dependency; `cdylib`/
# `staticlib` for the C-ABI/FFI shared library the Flutter app loads.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Stage 3a codec pipeline: pure-Rust PNG/JPEG (no C, cross-compiles trivially).
# libwebp/libjpeg-turbo/libavif slot in behind the ImageCodec interface later.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Stage 3b: lossy/lossless WebP via libwebp (C) — no good pure-Rust lossy encoder.
webp = "0.3"
# Stage 3c: AVIF encode via ravif (rav1e + avif-serialize) — PURE RUST, no C.
# asm off keeps the cross-compile trivial; enable later (nasm) for speed. The
# faster SVT-AV1 + dav1d decode (C) path can slot in behind the same interface.
ravif = { version = "0.11", default-features = false }
rgb = "0.8"
# Stage 4b: zlib (de)compression for PNG iCCP profiles. Pure Rust, already in the
# tree (image/png pulls it) — keeps Canonical.icc the uniform raw ICC profile.
miniz_oxide = "0.8"
# Stage 4c HDR: XMP property surgery — keep the gain-map (hdrgm/GContainer)
# properties while dropping privacy ones, so an Ultra-HDR JPEG survives a strip.
# Pure Rust, royalty-free (MIT).
quick-xml = { version = "0.40", default-features = false }
# Stage 5: pure-Rust AV1 decode (the dav1d port) for AVIF; royalty-free
# (BSD-2, AV1 is patent-free). bitdepth_16 unlocks 10-bit/HDR decode. HEIC stays
# HW-only (HEVC carries active patents — CLAUDE.md §5).
rav1d = { version = "1.1.0", default-features = false, features = [
    "bitdepth_8",
    "bitdepth_16",
] }

# dav1d's arm64 assembly (PERF-05): about twice the AV1 decode speed on the
# phones, built by `cc` (no nasm). The dotprod/i8mm routines run only where
# the CPU reports them (rav1d detects at run time). Off on x86: nasm's objects
# do not link into a shared library, and x86 is only the emulator and hosts.
[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1d = { version = "1.1.0", default-features = false, features = [
    "asm",
    "asm_arm64_dotprod",
    "asm_arm64_i8mm",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# rav1d 1.1.0 as published lacks src/arm/asm-offsets.h, which three arm64
# assembly files include; its repository at the same tag has it (PERF-05).
# Back to crates.io once a release ships the header.
[patch.crates-io]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0" }
