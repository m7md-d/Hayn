org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Android toolchain versions (single source of truth) ───────────────────────
# Referenced from settings.gradle.kts so the plugin versions live as variables,
# not inline literals. AGP 9 makes built-in Kotlin the default (breaks community
# plugins like flutter_avif_android), so we stay on the stable 8.x line that
# Flutter recommends for this SDK.
agpVersion=8.11.1
kotlinVersion=2.2.20

# Compile Kotlin inside the Gradle daemon — a separate Kotlin daemon can fail to
# connect under tight memory and surface as spurious compile errors.
kotlin.compiler.execution.strategy=in-process
# Plugins that pin Java to 11 while Kotlin follows the JDK trip a cross-target
# check; D8 normalises bytecode levels at runtime, so warn instead of error.
kotlin.jvm.target.validation.mode=warning
