name: hayn
description: Offline media studio — compress, convert, trim, and protect your media.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.8.1

  # Localization
  intl: ^0.20.2

  # Settings persistence
  shared_preferences: ^2.3.5

  # Media library
  photo_manager: ^3.3.0

  # Typography
  google_fonts: ^6.1.0

  # External URLs (GitHub repo link opens in system browser)
  url_launcher: ^6.3.1

  # In-app video playback (Asset Detail)
  video_player: ^2.9.2
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_image_compress: ^2.4.0
  flutter_avif: ^3.1.0
  image: ^4.8.0
  exif: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.33.0
flutter:
  uses-material-design: true
  generate: true
  # Localisation is gen-l10n from lib/app/l10n (see l10n.yaml) — not runtime
  # assets. The bundled ONNX model under assets/ lands with the audio phase.
