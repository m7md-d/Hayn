name: hayn
description: Offline media studio — compress, convert, trim, and protect your media.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Localization
  intl: ^0.20.2

  # Settings persistence
  shared_preferences: ^2.3.5

  # Media library
  photo_manager: ^3.3.0

  # Typography
  google_fonts: ^6.1.0

  # External URLs (GitHub repo link opens in system browser)
  url_launcher: ^6.3.1

  # In-app video playback (Asset Detail)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/i18n/
